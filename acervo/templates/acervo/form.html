{% extends 'acervo/base.html' %} {% block conteudo %}
<div class="card">
  <div class="card-header">
    <h1>{{ acao }} Livro</h1>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="form-container">
      {% for field in form %}
        {% if field.name == 'disponivel' %}
          <div class="checkbox-container">
            {{ field }}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          </div>
        {% else %}
          <p>
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <span class="error">{{ field.errors.0 }}</span>
            {% endif %}
          </p>
        {% endif %}
      {% endfor %}
    </div>
    <button type="submit" class="btn">Salvar Livro</button>
    <a
      href="{% url 'lista' %}"
      style="
        margin-left: 1rem;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.9rem;
      "
      >Cancelar</a
    >
  </form>
</div>
{% endblock %}
